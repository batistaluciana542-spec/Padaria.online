<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Padaria Artesanal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-24">

    <!-- Header -->
    <header class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-amber-500/10 flex items-center justify-center border border-amber-500/20 text-amber-400">
                <i class="fa-solid fa-bread-slice text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-base leading-tight">Padaria Artesanal</h1>
                <div class="flex items-center space-x-1.5 mt-0.5">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span class="text-xs text-emerald-400 font-medium">Online (Modo Local)</span>
                </div>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="abrirAdmin()" class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center text-amber-400 border border-slate-700 active:scale-95 transition">
                <i class="fa-solid fa-key"></i>
            </button>
            <button onclick="abrirCarrinho()" class="relative w-10 h-10 rounded-xl bg-violet-600 flex items-center justify-center text-white shadow-lg shadow-violet-600/30 active:scale-95 transition">
                <i class="fa-solid fa-cart-shopping"></i>
                <span id="cart-badge" class="absolute -top-1 -right-1 w-5 h-5 bg-rose-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center border-2 border-slate-900 hidden">0</span>
            </button>
        </div>
    </header>

    <!-- Categories -->
    <div class="px-4 py-4 overflow-x-auto no-scrollbar">
        <div class="flex space-x-2 min-w-max" id="category-filters">
            <button onclick="filtrar('todos')" class="cat-btn px-4 py-2 rounded-xl text-sm font-semibold bg-violet-600 text-white transition shadow-sm">Todos</button>
            <button onclick="filtrar('paes')" class="cat-btn px-4 py-2 rounded-xl text-sm font-semibold bg-slate-900 text-slate-400 border border-slate-800 transition">Pães</button>
            <button onclick="filtrar('doces')" class="cat-btn px-4 py-2 rounded-xl text-sm font-semibold bg-slate-900 text-slate-400 border border-slate-800 transition">Doces & Bolos</button>
            <button onclick="filtrar('salgados')" class="cat-btn px-4 py-2 rounded-xl text-sm font-semibold bg-slate-900 text-slate-400 border border-slate-800 transition">Salgados</button>
        </div>
    </div>

    <!-- Products Grid -->
    <main class="px-4">
        <div id="produtos-grid" class="grid grid-cols-2 gap-3">
            <!-- Renderizado via JS -->
        </div>
    </main>

    <!-- Modal Admin -->
    <div id="admin-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl">
            <div id="admin-login-view">
                <h3 class="text-lg font-bold mb-1">Painel Administrativo</h3>
                <p class="text-xs text-slate-400 mb-4">Insira o PIN de acesso (1943)</p>
                <input type="password" id="pin-input" placeholder="PIN" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-center text-xl tracking-widest text-white mb-3 focus:outline-none focus:border-amber-500">
                <div class="flex space-x-2">
                    <button onclick="fecharAdmin()" class="flex-1 py-2.5 rounded-xl bg-slate-800 text-slate-300 text-sm font-semibold">Cancelar</button>
                    <button onclick="validarPin()" class="flex-1 py-2.5 rounded-xl bg-amber-500 text-slate-950 text-sm font-bold">Entrar</button>
                </div>
            </div>
            <div id="admin-panel-view" class="hidden">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-amber-400">Gerir Produtos</h3>
                    <button onclick="fecharAdmin()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                </div>
                <div class="space-y-3 mb-4">
                    <input type="text" id="novo-nome" placeholder="Nome do produto" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white">
                    <input type="number" step="0.01" id="novo-preco" placeholder="Preço (€)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white">
                    <select id="nova-categoria" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white">
                        <option value="paes">Pães</option>
                        <option value="doces">Doces & Bolos</option>
                        <option value="salgados">Salgados</option>
                    </select>
                    <input type="text" id="novo-desc" placeholder="Descrição curta" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white">
                    <button onclick="adicionarProduto()" class="w-full py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-sm shadow-lg shadow-emerald-600/20">Adicionar Produto</button>
                </div>
                <hr class="border-slate-800 mb-3">
                <button onclick="limparDados()" class="w-full py-2 rounded-xl bg-rose-500/10 text-rose-400 text-xs font-semibold border border-rose-500/20">Restaurar Produtos padrão</button>
            </div>
        </div>
    </div>

    <!-- Script Principal -->
    <script>
        let produtosPadrao = [
            { id: 1, nome: "Pão Francês", preco: 0.25, categoria: "paes", descricao: "Fresquinho e crocante", imagem: "https://images.unsplash.com/photo-1549931319-a545dcf3bc73?w=300" },
            { id: 2, nome: "Croissant de Manteiga", preco: 1.20, categoria: "paes", descricao: "Folhado dourado artesanal", imagem: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=300" },
            { id: 3, nome: "Bolo de Laranja", preco: 2.50, categoria: "doces", descricao: "Fofinho com cobertura caseira", imagem: "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=300" },
            { id: 4, nome: "Coxinha de Frango", preco: 1.80, categoria: "salgados", descricao: "Massa crocante recheada", imagem: "https://images.unsplash.com/photo-1541529086526-db283c563270?w=300" }
        ];

        let carrinho = [];
        let categoriaAtual = 'todos';

        function obterProdutos() {
            let salvos = localStorage.getItem('selk_produtos');
            if (!salvos) {
                localStorage.setItem('selk_produtos', JSON.stringify(produtosPadrao));
                return produtosPadrao;
            }
            return JSON.parse(salvos);
        }

        function renderizarProdutos(filtro = 'todos') {
            let prods = obterProdutos();
            let grid = document.getElementById('produtos-grid');
            grid.innerHTML = '';

            let filtrados = filtro === 'todos' ? prods : prods.filter(p => p.categoria === filtro);

            if (filtrados.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center py-10 text-slate-500 text-sm">Nenhum produto encontrado.</div>`;
                return;
            }

            filtrados.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-3 flex flex-col justify-between">
                        <div>
                            <div class="w-full h-28 rounded-xl bg-slate-800 mb-2 overflow-hidden">
                                <img src="${p.imagem}" alt="${p.nome}" class="w-full h-full object-cover">
                            </div>
                            <h4 class="font-bold text-sm text-slate-100 truncate">${p.nome}</h4>
                            <p class="text-[11px] text-slate-400 line-clamp-1 mt-0.5">${p.descricao || ''}</p>
                        </div>
                        <div class="flex items-center justify-between mt-3 pt-2 border-t border-slate-800/50">
                            <span class="font-bold text-amber-400 text-sm">€ ${Number(p.preco).toFixed(2)}</span>
                            <button onclick="adicionarAoCarrinho(${p.id})" class="w-8 h-8 rounded-lg bg-violet-600 text-white flex items-center justify-center active:scale-95 transition">
                                <i class="fa-solid fa-plus text-xs"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function filtrar(cat) {
            categoriaAtual = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-4 py-2 rounded-xl text-sm font-semibold bg-slate-900 text-slate-400 border border-slate-800 transition";
            });
            event.target.className = "cat-btn px-4 py-2 rounded-xl text-sm font-semibold bg-violet-600 text-white transition shadow-sm";
            renderizarProdutos(cat);
        }

        function abrirAdmin() {
            document.getElementById('admin-modal').classList.remove('hidden');
            document.getElementById('admin-login-view').classList.remove('hidden');
            document.getElementById('admin-panel-view').classList.add('hidden');
            document.getElementById('pin-input').value = '';
        }

        function fecharAdmin() {
            document.getElementById('admin-modal').classList.add('hidden');
        }

        function validarPin() {
            let pin = document.getElementById('pin-input').value;
            if (pin === '1943') {
                document.getElementById('admin-login-view').classList.add('hidden');
                document.getElementById('admin-panel-view').classList.remove('hidden');
            } else {
                alert('PIN incorreto!');
            }
        }

        function adicionarProduto() {
            let nome = document.getElementById('novo-nome').value;
            let preco = document.getElementById('novo-preco').value;
            let categoria = document.getElementById('nova-categoria').value;
            let descricao = document.getElementById('novo-desc').value;

            if (!nome || !preco) {
                alert('Preencha pelo menos o nome e o preço!');
                return;
            }

            let prods = obterProdutos();
            prods.push({
                id: Date.now(),
                nome,
                preco: parseFloat(preco),
                categoria,
                descricao,
                imagem: "https://images.unsplash.com/photo-1509440159596-0249088772ff?w=300"
            });

            localStorage.setItem('selk_produtos', JSON.stringify(prods));
            document.getElementById('novo-nome').value = '';
            document.getElementById('novo-preco').value = '';
            document.getElementById('novo-desc').value = '';
            renderizarProdutos(categoriaAtual);
            alert('Produto adicionado com sucesso!');
        }

        function limparDados() {
            if (confirm('Deseja restaurar os produtos padrão?')) {
                localStorage.setItem('selk_produtos', JSON.stringify(produtosPadrao));
                renderizarProdutos('todos');
                alert('Restaurado!');
            }
        }

        function adicionarAoCarrinho(id) {
            let prods = obterProdutos();
            let prod = prods.find(p => p.id === id);
            carrinho.push(prod);
            let badge = document.getElementById('cart-badge');
            badge.innerText = carrinho.length;
            badge.classList.remove('hidden');
        }

        function abrirCarrinho() {
            if (carrinho.length === 0) {
                alert('O seu carrinho está vazio!');
                return;
            }
            let total = carrinho.reduce((sum, item) => sum + Number(item.preco), 0);
            let nomes = carrinho.map(i => i.nome).join(', ');
            alert(`Itens no carrinho: ${nomes}\nTotal: € ${total.toFixed(2)}`);
        }

        // Inicializar
        renderizarProdutos();
    </script>
</body>
</html>
